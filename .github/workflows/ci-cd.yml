name: CI / CD

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (frontend)
        working-directory: .
        run: |
          npm ci

      - name: Build frontend
        working-directory: .
        run: |
          npm run build

      - name: Deploy frontend to Vercel (if token present)
        if: secrets.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          prod: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crowdfunding-backend:latest
            ghcr.io/${{ github.repository_owner }}/crowdfunding-backend:${{ github.sha }}

      - name: Deploy backend to Railway (if token present)
        if: secrets.RAILWAY_TOKEN != '' && secrets.RAILWAY_PROJECT_ID != ''
        run: |
          npm install -g @railway/cli
          railway login --apiKey $RAILWAY_TOKEN
          railway up --project $RAILWAY_PROJECT_ID --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Deployment summary
        run: |
          echo "Frontend build done; backend image pushed to GHCR."
          echo "If Vercel/Railway tokens were provided as secrets, deployments were triggered."
